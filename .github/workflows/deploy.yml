name: Deploy Nx Module Federation Apps

on:
  push:
    branches:
      - main  # deploy when pushing to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build dashboard (host)
        run: npx nx build dashboard --configuration=production

      - name: Build sunset (remote)
        run: npx nx build sunset --configuration=production

      # Deploy dashboard to gh-pages (branch: gh-pages, folder: dashboard)
      - name: Deploy dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/apps/dashboard
          destination_dir: ''
          keep_files: false

      # Deploy sunset to gh-pages (branch: gh-pages, folder: sunset)
      - name: Deploy sunset
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/apps/sunset
          destination_dir: sunset
          keep_files: true
